name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'

permissions:
  contents: read

jobs:
  security:
    name: Security and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        # The lockfile was resolved with npm's legacy peer mode; keep CI
        # deterministic and identical to the checked-in lockfile resolution.
        run: npm ci --legacy-peer-deps

      - name: Audit high and critical dependencies
        shell: bash
        run: |
          set -o pipefail
          audit_status=0
          npm audit --audit-level=high --json > "$RUNNER_TEMP/npm-audit.json" || audit_status=$?
          node scripts/check-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json" .security-audit-allowlist.json
          if [ "$audit_status" -ne 0 ]; then
            echo "npm audit reported findings; the policy script above must account for every high/critical item."
          fi

      - name: No credentials in browser storage
        shell: bash
        run: |
          set -euo pipefail
          matches="$(rg -n -i --hidden \
            --glob '!.git/**' --glob '!node_modules/**' --glob '!dist/**' --glob '!build/**' \
            '(localStorage|sessionStorage)\.(setItem|getItem|removeItem)[[:space:]]*\([^,)]{0,60}(token|jwt|auth|secret|api[_-]?key|credential|refresh|id_token|access)' \
            src app public static 2>/dev/null || true)"
          unexpected="$(printf '%s\n' "$matches" | grep -vFf .security-storage-allowlist || true)"
          if [ -n "$unexpected" ]; then
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Project tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
