version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint — the parser eslint.config.mjs is built on — throws at
      # import time on TS 7 (`typescript-eslint does not support TS 7.0.`), and
      # every published version, canaries included, declares
      # `peerDependencies.typescript: ">=4.8.4 <6.1.0"`. Tracking issue:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # A TS 7 bump therefore can never pass the lint step, so dependabot would
      # only re-open a permanently red PR every week. Drop this rule (or run
      # `@dependabot recreate`) once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        versions: [">= 7"]
